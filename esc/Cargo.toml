[package]
name = "ddd-4-rust-esc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event Store Commons: EventStoreRepository for event-sourced aggregates"

[dependencies]
ddd-4-rust-core = { path = "../core" }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
